services:
  aggregate_twin:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - custom=${USERPROFILE}/.ssh/git_clone_no_pass
    container_name: aggregate_twin
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      REDIS_HOST: redis
      TWIN_NAMESPACE: digitaltwin
      TWIN_GUI_PORT: "8082"
    ports:
      - "8082:8082"
    networks:
      - twin_net


networks:
  twin_net:
    external: true