# Kind layer, any UAV
# Modelled as a planar omni agent

kind: uav

kinematics:
  name: omni
  vel_max: [0.5, 0.5]              # [vx, vy] m/s, world frame
  vel_min: [-0.5, -0.5]
shape: {name: circle, radius: 0.15}
radius: 0.15

mass: 0.08                         # kg, Tello-class
friction: 0.0                      # unused by anc_only, but required when a battery is set
avg_speed: 0.3
max_speed: 0.5

battery:
  name: anc_only                   # hover power dominates: constant drain, distance is free
  init: 100.0
  capacity: 15000.0                # J (≈ 4.2 Wh pack)
  anc_drain: 19.0                  # W → ≈ 13 min flight
  scale: 1.0

controller:
  name: PPC                        # waypoint follower that ignores obstacles (pure persuit)
  k_p: 1.0
  max_speed: 0.5

estimator:
  name: ekf
  response_time: 0.3
  state_noise: 0.02
  velocity_noise: 0.5
  gate: null

topics: {action: out}
perception_sensors: []