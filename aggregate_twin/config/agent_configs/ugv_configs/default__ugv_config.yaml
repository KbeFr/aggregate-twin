# kind layer, any UGV

kind: ugv

kinematics:
  name: diff
  vel_max: [0.3, 1.0]              # [v m/s, w rad/s]; the code default is [1, 1]
  vel_min: [-0.3, -1.0]
shape: {name: circle, radius: 0.2}
radius: 0.2                        # bounding radius used by the aggregate grid

mass: 3.0                          # kg
friction: 0.25                     # used by the battery model
avg_speed: 0.2                     # m/s, used for mission time bids
max_speed: 0.3                     # m/s

battery:
  name: two_friction               # 2·µ·m·g J/m travelled + ancillary W
  init: 100.0                      # %
  capacity: 72000.0                # J (20 Wh)
  anc_drain: 5.0                   # W, onboard electronics
  scale: 1.0

controller:
  name: c3bf
  robot_type: diff
  safety_margin: 0.1               # m
  goal_gain: 0.8
  lookahead: 0.25

estimator:
  name: ekf
  response_time: 0.2               # s, lag from command to actual velocity
  state_noise: 0.01
  velocity_noise: 0.3
  gate: null                       # χ² gate off by default

topics: {action: out}              # sensors add their own channels
perception_sensors: []