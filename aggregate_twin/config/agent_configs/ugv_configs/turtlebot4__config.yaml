# Type layer, TurtleBot 4, ROS 2 Humble (agent_type: turtlebot4)


shape: {name: circle, radius: 0.172}     # Create 3 base, Ø = 342 mm
radius: 0.172
kinematics:
  name: diff
  vel_max: [0.3, 1.0]                    # safe-mode top speed = 0.31 m/s
  vel_min: [-0.3, -1.0]
mass: 3.9                                # standard model, the lite is = 3.3 kg
friction: 0.25
avg_speed: 0.2
max_speed: 0.3

battery:
  name: two_friction
  init: 100.0                            # overwritten by BatteryState readings
  capacity: 93600.0                      # J, 26 Wh pack
  anc_drain: 9.0                         # W for Pi + camera + lidar, tune from a logged discharge
  scale: 1.0

state_sensors:
  # the external position reported by aggregate
  - name: external_pose
    topic: external_pose
    noise: {x: 0.02, y: 0.02, theta: 0.03}

  - name: odom
    noise: {vx: 0.02, wz: 0.05}

estimator: {name: ekf, gate: 16.3}   # no initial_pose, it waits for the first camera fix


perception_sensors:
  # lidar can be used but not tested yet
  - name: lidar
    radius: 0.1
    cell: 0.3
    offset:
      position: {x: 0.0, y: 0.0, z: 0.2}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}


controller: {name: c3bf, robot_type: diff, safety_margin: 0.1, goal_gain: 0.6}

interface:
  name: turtlebot4
  ros_distro: humble

  # for if you want to change ros type mapping, cause of specialize interface not necessary ofc
  ros_types:
    odom: nav_msgs/msg/Odometry
  # params for specific translations
  params:
    lidar: {max_range: 3.0, cluster_gap: 0.15, min_points: 3}