
# This is the default robot config for if to little info is given in discovery

agent_name: 'robot0' #should be same
agent_id: 0           #not really used in code
agent_type : 'turtlebot3' #for config reason

kind : ugv

mass : 1.0                #kg
avg_speed : 1             #m/s
max_speed : 1.5           #m/s
friction : 0.25

battery:
  name: 'two_friction'
  init : 100.0            #%
  anc_drain : 5.0
  scale : 1
  capacity : 71928.0      #J

kinematics: {name: 'diff'}

shape: {name: 'circle',
        radius: 0.2}

controller: {name: 'c3bf' ,
             robot_type: 'diff',
             safety_margin: 0.05,
             goal_gain: 0.8
}

perception_sensors:  # -> DiscoveryMessage.perception_sensors
  #    - name: 'aruco'
  #      offset_pose: [0.0, 0.0, 0.0] #x ,y ,z
  #      offset_angle: [0.0,0.0,0.0] #roll, pitch , jaw
  #      shape_config:
  #        name: 'rectangle'
  #        length: 4.0
  #        width: 3.0
      - name: 'sim2d_object'
        offset_pose: [0.0, 0.0, 0.0] #x ,y ,z
        offset_angle: [0.0,0.0,0.0] #roll, pitch , jaw
        shape_config:
          name: 'wedge'
          max_range: 4.0
          fov_angle: 1.57



topics: {action: out, imu : in , wheel_odom: in , pose : in , detections: in } # reverse from agent, for instance


