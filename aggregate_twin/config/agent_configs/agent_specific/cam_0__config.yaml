# static camera to imitate uav detection of arucodes

shape: {name: circle, radius: 0.05}
radius: 0.05

state_sensors: []                     # static: placed once by estimator.initial_pose
battery: {name: dummy}                # mains powered: no modelled drain (merges init/capacity from the kind layer)

estimator:
  name: ekf
  initial_pose: [2.0, 1.5, 0.0]       # calibrated camera x, y [m]; yaw 0, the mount carries the full rotation
  initial_std: 0.01
  state_noise: 0.0                    # a static camera does not drift

perception_sensors:
  - name: aruco
    radius: 0.08                       # obstacle size given to markers that are not agents
    std_floor: 0.01                   # error model, fit from the static validation grid
    k_xy: 0.002
    offset:
      position: {x: 0, y: 0, z: 2}                              # calibrated lens height [m]
      orientation: {x: 0.7071, y: -0.7071, z: 0, w: 0}           # optical frame, straight down, image top = +x

interface:
  name: ros2                          # registered names: simulated, ros2, turtlebot4, turtlebot4_jazzy
  ros_distro: humble