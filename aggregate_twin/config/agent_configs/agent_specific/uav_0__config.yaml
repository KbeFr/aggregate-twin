# ── Agent layer · the camera drone ("uav_0") ───────────────────────────
interface:
  params:
    odom: {origin: [2.0, 1.5, 0.0]}   # takeoff spot in world coordinates
perception_sensors:                   # lists REPLACE lower layers: repeat the full list
  - name: aruco
    radius: 0.2
    offset:
      position: {x: 0.03, y: 0.0, z: -0.02}                  # measured on this airframe
      orientation: {x: 0.7071, y: -0.7071, z: 0.0, w: 0.0}   # from camera calibration