# Agent layer, one physical TurtleBot 4 ("ugv_0")
# Identity and placement of this unit.

perception_sensors: []                # lidar off

interface:
  params:
    odom: {origin: [0.5, 0.5, 0.0]}   # world [x, y, yaw] of its odom frame = where it boots/docks


battery: {scale: 1.1}                 # older pack, drains 10 % faster than modelled
controller: {safety_margin: 0.15}     # marker plate makes it a bit wider